name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cpms
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: cpms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend JavaScript syntax
        run: |
          for f in backend/web/*.js tests/*.js; do node --check "$f"; done
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend API tests (including a real Postgres database)
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql://cpms:localtest@localhost:5432/cpms_test
        run: pytest -q tests
      - name: Install browser for UI test
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Click through every feature in a real browser
        run: node tests/ui-smoke.js
